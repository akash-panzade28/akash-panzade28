  <title id="t">Akash Panzade, AI/ML Engineer building agentic AI platforms</title>
  <desc id="d">Name and role over three scrolling rows of the technology I work with: MCP, A2A protocol, LangGraph, Claude Agent SDK, OpenAI Agents SDK, Strands, CrewAI, Agno, agent skills, human-in-the-loop, model routing, AutoLLM, vLLM, SGLang, KServe, NVIDIA NIM, Mem0, Graphiti, Opik, OpenTelemetry, LLM-as-judge, trajectory evals, GraphRAG, pgvector, context engineering, event-driven agents, Kubernetes, Go, React · TypeScript, QLoRA.</desc>
